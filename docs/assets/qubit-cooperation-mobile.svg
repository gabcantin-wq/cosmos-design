<g font-family="Arial,sans-serif" fill="#526172" font-size="12"><text x="37" y="102">Conserver. Retrouver.</text><text x="37" y="120">Réutiliser.</text><text x="237" y="102">Des agents,</text><text x="237" y="120">des responsabilités.</text><text x="37" y="439">Partager à</text><text x="37" y="457">la bonne portée.</text><text x="237" y="439">Éprouver avant</text><text x="237" y="457">d’adopter.</text></g>
