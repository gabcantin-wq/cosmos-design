<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="title desc">
<title id="title">Une mission, des fonctions qui coopèrent</title><desc id="desc">La mémoire, les fonctions, la coopération et l'évolution sont reliées autour d'une mission commune. Illustration conceptuelle.</desc>
