<g font-family="Arial,sans-serif" fill="#0a121c"><text x="110" y="128" font-size="21" font-weight="700">MÉMOIRE</text><text x="110" y="148" font-size="12" fill="#536b84">Conserver. Retrouver. Réutiliser.</text><text x="872" y="128" font-size="21" font-weight="700">FONCTIONS</text><text x="872" y="148" font-size="12" fill="#536b84">Des agents, des responsabilités.</text><text x="110" y="392" font-size="20" font-weight="700">COOPÉRATION</text><text x="110" y="412" font-size="12" fill="#536b84">Partager à la bonne portée.</text><text x="872" y="392" font-size="21" font-weight="700">ÉVOLUTION</text><text x="872" y="412" font-size="12" fill="#536b84">Éprouver avant d'adopter.</text></g>
